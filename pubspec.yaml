name: aog_hymns_app
description: Assemblies of God hymnbook.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.3
